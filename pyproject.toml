[project]
name = "actionsieve"
version = "0.1.0"
description = "Multi-platform CI/CD pipeline security scanner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "James Golovich", email = "james@gnuinter.net" },
]
keywords = ["security", "cicd", "github-actions", "gitlab-ci", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click~=8.5",
    "pyyaml~=6.0",
    "jsonschema~=4.26",
    "jinja2~=3.1",
    "tree-sitter~=0.26.0",
    "tree-sitter-groovy~=0.1.2",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "ruff~=0.16.0",
    "mypy~=2.3",
    "pre-commit~=4.6",
    "types-PyYAML~=6.0",
    "types-jsonschema~=4.26",
]

[project.scripts]
actionsieve = "actionsieve.cli:main"

[project.urls]
Homepage = "https://github.com/OpenSecBench/ActionSieve"
Repository = "https://github.com/OpenSecBench/ActionSieve"
Issues = "https://github.com/OpenSecBench/ActionSieve/issues"
Changelog = "https://github.com/OpenSecBench/ActionSieve/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actionsieve"]
core-metadata-version = "2.3"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.3"

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
