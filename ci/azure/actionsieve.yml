parameters:
  - name: path
    type: string
    default: "."
  - name: format
    type: string
    default: json
    values: [json, yaml, sarif, markdown]
  - name: platform
    type: string
    default: ""
  - name: profile
    type: string
    default: ""
  - name: patterns
    type: string
    default: ""
  - name: failOn
    type: string
    default: ""
  - name: pythonVersion
    type: string
    default: "3.12"
  - name: extraArgs
    type: string
    default: ""

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: ${{ parameters.pythonVersion }}
    displayName: Set up Python

  - script: pip install --quiet actionsieve
    displayName: Install actionsieve

  - script: |
      args="scan --format ${{ parameters.format }}"

      if [ -n "${{ parameters.platform }}" ]; then
        args="$args --platform ${{ parameters.platform }}"
      fi
      if [ -n "${{ parameters.profile }}" ]; then
        args="$args --profile ${{ parameters.profile }}"
      fi
      if [ -n "${{ parameters.patterns }}" ]; then
        args="$args --patterns ${{ parameters.patterns }}"
      fi
      if [ -n "${{ parameters.failOn }}" ]; then
        args="$args --fail-on ${{ parameters.failOn }}"
      fi

      if [ "${{ parameters.format }}" = "sarif" ]; then
        args="$args --output $(Build.ArtifactStagingDirectory)/actionsieve.sarif"
      elif [ "${{ parameters.format }}" = "json" ]; then
        args="$args --output $(Build.ArtifactStagingDirectory)/actionsieve.json"
      fi

      if [ -n "${{ parameters.extraArgs }}" ]; then
        args="$args ${{ parameters.extraArgs }}"
      fi

      actionsieve $args "${{ parameters.path }}"
    displayName: Run actionsieve scan
    continueOnError: true

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      pathToPublish: $(Build.ArtifactStagingDirectory)
      artifactName: actionsieve-results
    displayName: Publish results
