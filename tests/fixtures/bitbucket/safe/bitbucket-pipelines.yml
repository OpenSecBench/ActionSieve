image: node@sha256:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2

pipelines:
  default:
    - step:
        name: Build
        script:
          - npm install
          - npm run build
          - pipe: atlassian/aws-s3-deploy:1.2.3
            variables:
              AWS_DEFAULT_REGION: us-east-1

  branches:
    main:
      - step:
          name: Deploy
          script:
            - npm run deploy
