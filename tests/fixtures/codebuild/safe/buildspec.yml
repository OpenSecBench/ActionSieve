version: 0.2

env:
  variables:
    NODE_ENV: production

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci

  build:
    commands:
      - npm run build
      - npm test

  post_build:
    commands:
      - echo "Build complete"

artifacts:
  files:
    - dist/**/*
