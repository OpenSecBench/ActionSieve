steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - 'gcr.io/$PROJECT_ID/app:$COMMIT_SHA'
      - .

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    env:
      - 'DB_PASSWORD=supersecret123'
      - 'API_TOKEN=tok_live_abc123'
    args:
      - -c
      - echo "deploying"

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'gcr.io/$PROJECT_ID/app:$COMMIT_SHA'

images:
  - 'gcr.io/$PROJECT_ID/app:$COMMIT_SHA'
