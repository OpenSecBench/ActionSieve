steps:
  - name: 'gcr.io/cloud-builders/docker:1.0.0'
    args:
      - build
      - -t
      - 'gcr.io/$PROJECT_ID/app:$COMMIT_SHA'
      - .

  - name: 'gcr.io/cloud-builders/docker:1.0.0'
    args:
      - push
      - 'gcr.io/$PROJECT_ID/app:$COMMIT_SHA'

serviceAccount: 'projects/myproject/serviceAccounts/ci@myproject.iam.gserviceaccount.com'

images:
  - 'gcr.io/$PROJECT_ID/app:$COMMIT_SHA'
