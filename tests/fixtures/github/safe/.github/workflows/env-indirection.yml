name: PR Greeting Safe
on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Greet PR author
        run: |
          echo "PR title: $PR_TITLE"
          echo "Thanks for the PR!"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
