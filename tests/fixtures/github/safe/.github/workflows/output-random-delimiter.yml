name: Process PR (random delimiter)
on: pull_request

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get description
        id: desc
        run: |
          DELIMITER=$(uuidgen)
          echo "desc<<$DELIMITER" >> "$GITHUB_OUTPUT"
          cat README.md >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"
      - run: echo "${{ steps.desc.outputs.desc }}"
