name: Process PR (random delimiter)
on: pull_request

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get description
        id: desc
        run: |
          DELIMITER=$(uuidgen)
          echo "desc<<$DELIMITER" >> "$GITHUB_OUTPUT"
          cat README.md >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"
      - run: echo "${{ steps.desc.outputs.desc }}"
