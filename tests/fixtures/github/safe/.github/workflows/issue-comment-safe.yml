name: label
on:
  issue_comment:
    types: [created]
jobs:
  label:
    if: github.event.comment.body == '/label'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['triaged']
            })
