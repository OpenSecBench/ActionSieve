steps:
  - label: ":hammer: Build"
    command:
      - echo "Building $BUILDKITE_BRANCH"
      - make build
    plugins:
      - myorg/deploy#v1:
          target: staging

  - label: ":rocket: Deploy"
    command: echo "Deploying ${BUILDKITE_MESSAGE}"

  - label: ":memo: Changelog"
    command: echo "$BUILDKITE_PULL_REQUEST_TITLE"

  - label: ":whale: Privileged Docker"
    command: npm run build
    plugins:
      - docker#v5.11.0:
          image: node:20
          privileged: true

  - label: ":socket: Socket Mount"
    command: npm run build
    plugins:
      - docker#v5.11.0:
          image: node:20
          volumes:
            - "/var/run/docker.sock:/var/run/docker.sock"

  - label: ":pipeline: Upload"
    command: buildkite-agent pipeline upload .buildkite/dynamic.yml

  - label: ":docker: Docker"
    command:
      - docker build -t myapp .
      - docker push myapp
    plugins:
      - docker-compose#v4.0.0:
          run: app
