target-version = "py312"
line-length = 99
exclude = ["docs/"]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific
    "S",     # flake8-bandit (security)
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "T20",   # flake8-print
]
ignore = [
    "S101",  # assert used in tests
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S106", "T20"]

[format]
quote-style = "double"
indent-style = "space"
