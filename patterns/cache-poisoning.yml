patterns:

  - id: fork-pr-cache-write
    title: Cache write in fork-reachable workflow
    description: |
      A workflow reachable from fork PRs writes to a shared CI cache.
      Fork-controlled builds populate caches with poisoned dependencies,
      toolchains, or build artifacts. If a later privileged run restores
      that cache, it executes attacker-controlled content with secrets.

      GitHub Actions v3+ scopes caches by GITHUB_REF, which limits
      cross-branch restoration. However: pull_request_target runs in the
      base branch context (cache writes go to base), self-hosted runners
      may share filesystem caches, and custom cache backends (S3, GCS)
      may not enforce ref scoping. Other platforms vary in cache isolation.
    platforms: "all"
    trigger: [pull_request, pull_request_target]
    trust_boundary: fork_controlled_build -> shared_cache -> privileged_restore
    attacker_model: fork_pr
    impact: [rce, supply_chain]
    severity_base: medium
    requires_self_hosted: false
    severity_notes: |
      Risk depends on cache isolation:
      - GitHub managed runners with actions/cache v3+: LOW (ref-scoped)
      - pull_request_target + cache write: HIGH (base branch cache)
      - Self-hosted with shared cache dirs: HIGH
      - Custom cache backends without ref scoping: HIGH
      - GitLab/CircleCI/Bitbucket with shared caches: MEDIUM
    detection:
      type: structural
    mitigations:
      - Use actions/cache/restore (read-only) in fork PR workflows
      - Scope cache keys to include GITHUB_REF or branch name
      - Use read-only cache policy for fork-triggered jobs
      - Avoid caching executable content (node_modules, pip packages)
      - Pin cache action to SHA and verify cache integrity
    cwe: CWE-345
    tags: [cache, poisoning, fork, supply-chain]
    references:
      - https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache
      - https://adnanthekhan.com/2024/05/06/the-monsters-in-your-build-cache-github-actions-cache-poisoning/
    status: active
