patterns:

  - id: circleci-env-injection
    title: Tainted environment variable in shell command
    description: |
      A CircleCI run step interpolates an attacker-controlled environment
      variable ($CIRCLE_BRANCH, $CIRCLE_PR_USERNAME) directly into a shell
      command. Fork PR authors control branch names; shell metacharacters
      in the value produce command injection.
    platforms: [circleci]
    trigger: [pull_request]
    trust_boundary: untrusted_user_input -> shell_execution
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      CircleCI fork PR builds are disabled by default. When enabled,
      secrets are not passed to fork builds unless explicitly configured.
      Self-hosted runners (namespaced resource_class) may have cached
      credentials.
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - '$CIRCLE_BRANCH'
        - '${CIRCLE_BRANCH}'
        - '$CIRCLE_PR_USERNAME'
        - '${CIRCLE_PR_USERNAME}'
        - '$CIRCLE_USERNAME'
        - '${CIRCLE_USERNAME}'
    mitigations:
      - Quote variables in shell commands
      - Use environment block to assign to a local variable
      - Disable fork PR builds if not needed
    cwe: CWE-78
    tags: [injection, circleci, environment-variable]
    status: active

  - id: circleci-pipeline-param-injection
    title: Tainted pipeline parameter in shell command
    description: |
      A CircleCI run step uses << pipeline.git.branch >>,
      << pipeline.git.tag >>, or << pipeline.parameters.X >> in a
      shell command. These values expand at config compile time,
      before the shell executes. An attacker controlling the branch
      name, tag, or API-triggered parameter can inject shell
      metacharacters.
    platforms: [circleci]
    trigger: [pull_request, push]
    trust_boundary: untrusted_user_input -> shell_execution
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      Pipeline parameters expand at config processing time, before the
      shell. Branch names and string parameters with metacharacters can
      break out of quoted contexts. Pipeline parameters can be set via
      the CircleCI API when triggering a pipeline.
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - '<< pipeline.git.branch >>'
        - '<< pipeline.git.tag >>'
        - '<< pipeline.parameters.'
        - '<< parameters.'
    mitigations:
      - Pass pipeline values through environment variables instead
      - Use BASH_ENV or command substitution with proper quoting
      - Use enum-type parameters instead of string where possible
    cwe: CWE-78
    tags: [injection, circleci, pipeline-parameter]
    status: active

  - id: circleci-context-exposed
    title: CircleCI context available to fork PR builds
    description: |
      A job references a CircleCI context (shared secrets) and is
      reachable from fork PR builds. If fork builds are enabled and
      context restrictions are not configured, a fork PR author can
      access the context's secrets.
    platforms: [circleci]
    trigger: [pull_request]
    trust_boundary: fork_pr_execution -> context_secrets
    attacker_model: fork_pr
    impact: [secret_exfil]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      CircleCI disables fork PR builds by default. Even when enabled,
      secrets are not passed unless "Pass secrets to builds from forked
      pull requests" is checked. Context restrictions can limit which
      projects access a context. Severity depends on org configuration.
    detection:
      type: structural
      grep_patterns:
        - 'context:'
      checks:
        - job_has_secrets: true
        - fork_reachable: true
    mitigations:
      - Disable fork PR builds unless required
      - Do not enable "Pass secrets to builds from forked pull requests"
      - Use context restrictions to limit access to specific projects/branches
      - Use separate contexts for CI vs deploy secrets
    cwe: CWE-200
    tags: [secrets, circleci, context, fork]
    status: active

  - id: circleci-dynamic-config
    title: Dynamic config limits static analysis coverage
    description: |
      This config uses setup: true with the continuation orb to
      generate the actual pipeline config at runtime. The generated
      config cannot be analyzed statically — vulnerabilities in
      dynamically generated steps will not be detected.
    platforms: [circleci]
    attacker_model: any
    impact: [info_disclosure]
    severity_base: info
    requires_self_hosted: false
    severity_notes: |
      Not a vulnerability itself. Flags a gap in static analysis
      coverage. The generated config should be reviewed manually or
      captured and scanned separately.
    detection:
      type: structural
      grep_patterns:
        - 'setup: true'
    mitigations:
      - Capture generated config and scan it separately
      - Review continuation orb usage for injection risks
    tags: [circleci, dynamic-config, coverage-gap]
    status: active
