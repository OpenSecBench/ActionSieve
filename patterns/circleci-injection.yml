patterns:

  - id: circleci-env-injection
    title: Tainted environment variable in shell command
    description: |
      A CircleCI run step interpolates an attacker-controlled environment
      variable ($CIRCLE_BRANCH, $CIRCLE_PR_USERNAME) directly into a shell
      command. Fork PR authors control branch names; shell metacharacters
      in the value produce command injection.
    platforms: [circleci]
    trigger: [pull_request]
    trust_boundary: untrusted_user_input -> shell_execution
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      CircleCI fork PR builds are disabled by default. When enabled,
      secrets are not passed to fork builds unless explicitly configured.
      Self-hosted runners (namespaced resource_class) may have cached
      credentials.
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - '$CIRCLE_BRANCH'
        - '${CIRCLE_BRANCH}'
        - '$CIRCLE_PR_USERNAME'
        - '${CIRCLE_PR_USERNAME}'
        - '$CIRCLE_USERNAME'
        - '${CIRCLE_USERNAME}'
    mitigations:
      - Quote variables in shell commands
      - Use environment block to assign to a local variable
      - Disable fork PR builds if not needed
    cwe: CWE-78
    tags: [injection, circleci, environment-variable]
    status: active

  - id: circleci-pipeline-param-injection
    title: Tainted pipeline parameter in shell command
    description: |
      A CircleCI run step uses << pipeline.git.branch >> or
      << pipeline.git.tag >> in a shell command. These values expand
      before the shell executes. An attacker controlling the branch name
      or tag can inject shell metacharacters.
    platforms: [circleci]
    trigger: [pull_request, push]
    trust_boundary: untrusted_user_input -> shell_execution
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      Pipeline parameters expand at config processing time, before the
      shell. Branch names with metacharacters can break out of quoted
      contexts. Tags are less commonly attacker-controlled but still
      untrusted.
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - '<< pipeline.git.branch >>'
        - '<< pipeline.git.tag >>'
    mitigations:
      - Pass pipeline values through environment variables instead
      - Use BASH_ENV or command substitution with proper quoting
    cwe: CWE-78
    tags: [injection, circleci, pipeline-parameter]
    status: active
