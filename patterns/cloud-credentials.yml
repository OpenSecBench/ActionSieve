patterns:

  - id: static-cloud-credentials
    title: Static cloud credentials instead of OIDC federation
    description: |
      Long-lived cloud credentials (AWS access keys, GCP service account
      JSON, Azure client secrets) are passed via environment variables or
      secrets. OIDC federation is the secure alternative — short-lived
      tokens scoped to the workflow run, no stored secrets to leak or
      rotate.
    platforms: "all"
    trigger: [any]
    trust_boundary: secret_store -> cloud_provider
    attacker_model: contributor
    impact: [secret_exfil]
    severity_base: low
    requires_self_hosted: false
    severity_notes: |
      Severity is low because the credentials may be properly scoped
      and rotated. Elevates to medium if the workflow is fork-reachable
      or if broad IAM permissions are in scope. The main risk is that
      static keys can be exfiltrated and reused outside CI.
    detection:
      type: single_step
      in_block: env
      grep_patterns:
        - 'AWS_ACCESS_KEY_ID'
        - 'AWS_SECRET_ACCESS_KEY'
        - 'AZURE_CLIENT_SECRET'
        - 'AZURE_CREDENTIALS'
        - 'GOOGLE_CREDENTIALS'
        - 'GOOGLE_APPLICATION_CREDENTIALS'
        - 'GCP_SA_KEY'
        - 'GCLOUD_SERVICE_KEY'
    mitigations:
      - "GitHub: use aws-actions/configure-aws-credentials with role-to-assume"
      - "GitHub: use google-github-actions/auth with workload_identity_provider"
      - "GitHub: use azure/login with OIDC federated credentials"
      - "GitLab: use id_tokens / CI_JOB_JWT for OIDC federation"
      - Scope static credentials to minimum required permissions
      - Rotate credentials frequently if OIDC is not available
    cwe: CWE-798
    tags: [secret-exposure, cloud, oidc, credentials]
    status: active
