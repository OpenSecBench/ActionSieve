patterns:

  - id: docker-in-docker
    title: Docker commands inside CI steps
    description: |
      Running docker run or docker build inside a CI step requires
      the Docker daemon socket or privileged mode. On shared runners
      this is a privilege escalation vector — the container can mount
      the host filesystem, access other containers, or escape the
      sandbox entirely.
    platforms: "all"
    trigger: [any]
    trust_boundary: ci_step -> host_docker_daemon
    attacker_model: contributor
    impact: [rce]
    severity_base: medium
    requires_self_hosted: false
    severity_notes: |
      On managed ephemeral runners (GitHub ubuntu-latest), Docker
      is available but the VM is isolated and discarded. Risk is
      lower than on shared self-hosted runners where the daemon
      persists. Severity increases when combined with fork-reachable
      triggers.
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - 'docker run '
        - 'docker build '
        - 'docker exec '
        - '--privileged'
        - '-v /var/run/docker.sock'
        - '-v /:/host'
    mitigations:
      - Use dedicated container build actions (docker/build-push-action)
      - Avoid mounting the Docker socket inside containers
      - Use rootless Docker or Podman for unprivileged builds
      - Restrict fork PR workflows from accessing Docker
    cwe: CWE-250
    tags: [privilege-escalation, docker, container-escape]
    status: active

  - id: docker-plugin-privileged
    title: Docker plugin with privileged mode or socket mount
    description: |
      A CI step uses a Docker plugin (e.g. Buildkite docker#) with
      privileged: true or mounts the Docker socket via volumes.
      Both grant the container full host access — equivalent to
      running as root on the host machine.
    platforms: [buildkite]
    trigger: [any]
    trust_boundary: ci_step -> host_docker_daemon
    attacker_model: contributor
    impact: [rce]
    severity_base: medium
    requires_self_hosted: false
    severity_notes: |
      The Docker plugin is Buildkite's idiomatic way to run containers.
      privileged: true enables all Linux capabilities and device access.
      Socket mounts allow arbitrary container creation on the host.
      Risk is higher on persistent self-hosted agents.
    detection:
      type: structural
    mitigations:
      - "Remove privileged: true unless absolutely required"
      - Avoid mounting the Docker socket into containers
      - Use rootless Docker or isolated build agents
      - Restrict plugin configuration via agent hooks
    cwe: CWE-250
    tags: [privilege-escalation, docker, container-escape, buildkite]
    status: active
