patterns:

  - id: jenkins-parameter-injection
    title: Parameter injection in shell step
    description: |
      Untrusted Jenkins pipeline parameters (user-supplied via Build
      with Parameters) are interpolated into sh/bat/powershell steps
      via Groovy string interpolation. Groovy expands ${params.X}
      before shell execution, enabling command injection.
    platforms: [jenkins]
    trigger: [push, multibranch]
    trust_boundary: untrusted_parameter -> shell_execution
    attacker_model: contributor
    impact: [rce]
    severity_base: high
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - '${params.'
    cwe: CWE-78
    tags: [injection, shell, jenkins]
    mitigations:
      - Use single-quoted strings to prevent Groovy interpolation
      - Pass parameters through environment block and shell variable references
      - Validate parameter values before use in shell commands

  - id: jenkins-change-injection
    title: Multibranch change variable injection in shell step
    description: |
      Attacker-controlled multibranch environment variables (CHANGE_TITLE,
      CHANGE_AUTHOR, BRANCH_NAME) are interpolated into shell steps via
      Groovy string interpolation. In multibranch pipelines processing
      fork PRs, these values are controlled by the PR author.
    platforms: [jenkins]
    trigger: [multibranch]
    trust_boundary: untrusted_change_metadata -> shell_execution
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - '${env.CHANGE_TITLE}'
        - '${env.CHANGE_AUTHOR}'
        - '${env.CHANGE_AUTHOR_DISPLAY_NAME}'
        - '${env.CHANGE_BRANCH}'
        - '${env.CHANGE_FORK}'
        - '${env.CHANGE_TARGET}'
        - '${env.BRANCH_NAME}'
    cwe: CWE-78
    tags: [injection, shell, jenkins]
    mitigations:
      - Use single-quoted strings in sh steps
      - Access environment variables via shell syntax ($CHANGE_TITLE) not Groovy interpolation
      - Validate branch names and PR metadata before interpolation
