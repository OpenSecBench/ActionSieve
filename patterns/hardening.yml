patterns:

  - id: missing-permissions-block
    title: Workflow has no explicit permissions block
    description: |
      This workflow does not declare a top-level permissions: block.
      Without explicit permissions, the GITHUB_TOKEN inherits the
      repository default — usually read-write to all scopes. Declaring
      permissions: {} or scoping to only what's needed limits blast
      radius if a step is compromised.
    platforms: [github]
    trigger: [pull_request, push]
    trust_boundary: default_token_scope
    attacker_model: any
    impact: [info_disclosure]
    severity_base: info
    requires_self_hosted: false
    severity_notes: |
      This is a hardening recommendation, not a direct vulnerability.
      The risk depends on the repository's default token permissions
      setting. Repos that have opted into restricted defaults are
      already protected.
    detection:
      type: structural
      grep_patterns:
        - 'jobs:'
    mitigations:
      - "Add permissions: {} at the workflow level for least-privilege"
      - "Scope permissions to only what each job needs"
      - "Set repository default token permissions to read-only"
    references:
      - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-the-minimum-scope-for-github_token-permissions
    tags: [hardening, github, permissions]
    status: active

  - id: checkout-persists-credentials
    title: Checkout persists credentials in git config
    description: |
      actions/checkout stores the GITHUB_TOKEN in .git/config by
      default (persist-credentials: true). Any subsequent step —
      including third-party actions — can read the token and use it
      for authenticated git operations or API calls.
    platforms: [github]
    trigger: [pull_request, push]
    trust_boundary: persisted_token -> subsequent_steps
    attacker_model: fork_pr
    impact: [secret_exfil]
    severity_base: low
    requires_self_hosted: false
    severity_notes: |
      Defense-in-depth measure. The persisted token has the same
      permissions as the job's GITHUB_TOKEN. Risk increases when
      the workflow runs third-party actions or fork PR code after
      checkout.
    detection:
      type: structural
      grep_patterns:
        - 'actions/checkout'
    mitigations:
      - "Set persist-credentials: false on checkout steps"
      - "Use a separate checkout step for untrusted code"
    references:
      - https://github.com/actions/checkout#persist-credentials
    tags: [hardening, github, credentials, checkout]
    status: active
