patterns:

  - id: output-delimiter-injection
    title: GITHUB_OUTPUT heredoc delimiter injection
    description: |
      Workflow uses a hardcoded heredoc delimiter (typically EOF) when
      writing multi-line values to GITHUB_OUTPUT or GITHUB_ENV. If
      attacker-controlled data contains the delimiter, the heredoc
      terminates early. Subsequent lines are parsed as new declarations.
      GITHUB_ENV injection can override PATH, LD_PRELOAD, NODE_OPTIONS.
    platforms: [github]
    trigger: [pull_request, workflow_dispatch]
    trust_boundary: untrusted_user_input -> workflow_state_manipulation
    attacker_model: fork_pr
    impact: [state_manipulation]
    severity_base: medium
    requires_self_hosted: false
    severity_notes: |
      Impact depends on what downstream steps do with the overridden
      output. GITHUB_ENV is more dangerous: arbitrary env var injection
      for subsequent steps, potentially overriding PATH, LD_PRELOAD, etc.
      GITHUB_OUTPUT override is usually low — misdirected routing.
    detection:
      type: single_step
      grep_patterns:
        - '<<EOF'
        - '<<HEREDOC'
        - ">> $GITHUB_OUTPUT"
        - ">> $GITHUB_ENV"
        - '>> "$GITHUB_OUTPUT"'
        - '>> "$GITHUB_ENV"'
      check_for: |
        Hardcoded delimiters with untrusted data written between them.
        Safe: random delimiter per write (uuidgen).
    mitigations:
      - Use random/unique delimiters (uuidgen) for each heredoc
      - Use single-line echo "name=value" when value is single-line
      - Validate that untrusted input doesn't contain newlines
    cwe: CWE-93
    tags: [injection, output, delimiter, env]
    references:
      - https://github.blog/changelog/2022-10-11-github-actions-deprecating-save-state-and-set-output-commands/
      - https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
    status: documented
