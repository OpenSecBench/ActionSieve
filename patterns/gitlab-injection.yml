patterns:

  - id: gitlab-variable-injection
    title: CI variable injection in script block
    description: |
      Untrusted CI variables (commit message, MR title, branch name) are
      interpolated directly into script blocks. GitLab expands $CI_*
      variables before shell execution, so metacharacters in attacker-
      controlled values produce command injection.
    platforms: [gitlab]
    trigger: [merge_request_event, push]
    trust_boundary: untrusted_ci_variable -> shell_execution
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - '$CI_COMMIT_MESSAGE'
        - '$CI_COMMIT_TITLE'
        - '$CI_MERGE_REQUEST_TITLE'
        - '$CI_MERGE_REQUEST_DESCRIPTION'
        - '$CI_COMMIT_TAG_MESSAGE'
        - '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
        - '$CI_EXTERNAL_PULL_REQUEST_SOURCE_BRANCH_NAME'
        - '$TRIGGER_PAYLOAD'
    cwe: CWE-78
    tags: [injection, gitlab]
    mitigations:
      - Store tainted variables in CI/CD variables with masked/protected flags
      - Use printf '%s' instead of echo for untrusted values
      - Validate inputs before interpolation

  - id: gitlab-ref-name-injection
    title: Branch/tag name injection in script block
    description: |
      CI_COMMIT_REF_NAME contains the branch or tag name, which
      contributors control. When interpolated into scripts, it enables
      command injection via branch names containing shell metacharacters.
    platforms: [gitlab]
    trigger: [push, merge_request_event]
    trust_boundary: untrusted_ref_name -> shell_execution
    attacker_model: contributor
    impact: [rce]
    severity_base: medium
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - '$CI_COMMIT_REF_NAME'
    cwe: CWE-78
    tags: [injection, gitlab]
    mitigations:
      - Validate ref names against an allowlist
      - Quote variables in shell commands
