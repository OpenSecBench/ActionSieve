patterns:

  - id: mutable-action-ref
    title: Action referenced by mutable tag or branch
    description: |
      A workflow references a third-party action using a tag (v1, v2)
      or branch (main) instead of a pinned commit SHA. If the action
      maintainer's account is compromised or the repo taken over, the
      ref can be moved to malicious code. All workflows using the mutable
      ref execute compromised code on next run.
    platforms: "all"
    trigger: [any]
    trust_boundary: third_party_action_supply_chain
    attacker_model: action_maintainer_compromise
    impact: [supply_chain, rce, secret_exfil]
    severity_base: medium
    requires_self_hosted: false
    severity_notes: |
      Supply chain risk, not a direct vulnerability. Target repo is only
      vulnerable if upstream is compromised. Blast radius can be enormous.
      Even first-party actions are not immune (tj-actions incident).
    detection:
      type: supply_chain
      grep_patterns:
        - 'uses: '
      check_for: |
        Action references using tags (@v1, @v2.3.4) or branches (@main)
        instead of commit SHAs (@abc123def...).
      safe_if:
        - "uses: owner/repo@<40-char-hex-sha>  # vX.Y.Z"
    mitigations:
      - Pin all action references to full commit SHAs
      - Add version tag as trailing comment for readability
      - Use Dependabot or Renovate to update SHA pins
      - Use actions/allow-list to restrict which actions can run
    cwe: CWE-829
    tags: [supply-chain, pinning, actions, mutable-ref]
    references:
      - https://blog.stepsecurity.io/tj-actions-verify-changed-files-attack-timeline
      - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
    status: documented

  - id: action-version-advisory
    title: Action version matches known security advisory
    description: |
      A workflow uses an action version that has a published security
      advisory. The action may be pinned but still point to a
      compromised release or tag.
    platforms: "all"
    trigger: [any]
    trust_boundary: compromised_action_supply_chain
    attacker_model: action_maintainer_compromise
    impact: [supply_chain, rce, secret_exfil]
    severity_base: critical
    requires_self_hosted: false
    severity_notes: |
      Matched against bundled advisory database. Critical severity
      because the action version is known-compromised — not theoretical
      supply chain risk but confirmed malicious code.
    detection:
      type: advisory
    mitigations:
      - Update to a version released after the advisory was resolved
      - Pin to a known-good SHA predating the compromise
      - Remove the action if no safe version exists
    cwe: CWE-829
    tags: [supply-chain, advisory, compromised]
    references:
      - https://github.com/advisories
    status: active

  - id: oidc-token-fork
    title: OIDC token minting from fork PR context
    description: |
      A workflow has id-token: write permission. If available to fork PR
      runs, the fork author can mint OIDC tokens asserting the base
      repository's identity. These tokens can be exchanged for cloud
      credentials (AWS, GCP, Azure) if OIDC federation is configured.
    platforms: [github]
    trigger: [pull_request]
    trust_boundary: fork_pr_execution -> cloud_identity_assertion
    attacker_model: fork_pr
    impact: [secret_exfil]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      GitHub docs state OIDC tokens are NOT available for fork PRs.
      However, some workflows still set id-token: write. Actual behavior
      should be verified. If mintable: cloud credential theft, potentially
      accessing production infrastructure.
    detection:
      type: structural
      grep_patterns:
        - 'id-token: write'
      check_for: |
        1. id-token: write on a pull_request workflow
        2. Whether OIDC federation is configured with cloud providers
        3. Whether GitHub actually provides OIDC tokens for fork PRs
    mitigations:
      - GitHub blocks OIDC for fork PRs by default (verify this)
      - Scope OIDC trust policies to specific branches, not just repo
      - Add conditions to OIDC claims (ref must be refs/heads/main)
    cwe: CWE-287
    tags: [oidc, cloud, identity, fork]
    references:
      - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect
    status: active

  - id: actions-cache-poisoning
    title: GitHub Actions cache poisoning across refs
    description: |
      A workflow uses actions/cache with a key that doesn't include the
      ref, with restore-keys allowing cross-branch restoration. If a fork
      PR can write to a cache that a privileged run later restores,
      poisoned content (malicious node_modules, binaries) executes with
      secrets.
    platforms: [github]
    trigger: [pull_request, push]
    trust_boundary: fork_pr_cache_write -> privileged_cache_restore
    attacker_model: fork_pr
    impact: [rce, secret_exfil]
    severity_base: medium
    requires_self_hosted: false
    severity_notes: |
      GitHub cache scoping (as of 2026): caches are scoped to GITHUB_REF.
      Fork PR pull_request uses refs/pull/N/merge. This ref can READ from
      base cache but NOT WRITE to it. Cache written under refs/pull/N/merge
      is NOT restorable from a push to base.
      Fork PR cache poisoning is generally NOT possible on GitHub-hosted
      runners. However: verify restore-keys, check self-hosted with shared
      cache dirs, check custom cache backends (S3) without ref scoping.
    detection:
      type: structural
      grep_patterns:
        - 'actions/cache'
        - 'restore-keys'
      check_for: |
        1. Cache key does not include branch/ref
        2. restore-keys allow prefix matching across branches
        3. Cached content includes executable code
    mitigations:
      - Include GITHUB_REF or branch name in cache key
      - Disable restore-keys or make them branch-specific
      - Use actions/cache/save and actions/cache/restore separately
    actions_versions:
      - action: actions/cache
        version: "v3+"
        notes: "v3+ enforces branch scoping. Fork PRs cannot write to base branch cache."
      - action: actions/cache
        version: "v2"
        notes: "v2 had weaker scoping — verify"
    cwe: CWE-345
    tags: [cache, poisoning, supply-chain]
    references:
      - https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache
    status: documented

  - id: truncated-sha-pin
    title: Action pinned to truncated commit SHA
    description: |
      A workflow pins an action to a hex string shorter than 40 characters.
      Git resolves short SHAs to the first matching object, which can become
      ambiguous as the repository grows. An attacker who controls the action
      repo can craft a commit whose SHA shares the same prefix, hijacking
      the resolution. Use full 40-character commit SHAs.
    platforms: "all"
    trigger: [any]
    trust_boundary: third_party_action_supply_chain
    attacker_model: action_maintainer_compromise
    impact: [supply_chain]
    severity_base: info
    requires_self_hosted: false
    severity_notes: |
      Informational — the developer intended to pin but used a short SHA.
      Exploitability is low (SHA prefix collision requires targeted effort)
      but the fix is trivial: use the full 40-char SHA.
    detection:
      type: structural
      grep_patterns:
        - 'uses: '
      check_for: |
        Action reference whose ref is 7–39 hex characters — looks like a
        SHA pin attempt but isn't the full 40-char commit hash.
    mitigations:
      - Expand to full 40-character commit SHA
      - Use Dependabot or Renovate to manage SHA pins
    cwe: CWE-829
    tags: [supply-chain, pinning, actions, truncated-sha]
    references:
      - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
    status: active
