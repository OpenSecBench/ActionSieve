patterns:

  - id: prt-checkout-head
    title: pull_request_target with PR head checkout
    description: |
      A pull_request_target workflow checks out the PR's head ref instead
      of the base branch. pull_request_target runs with base branch secrets
      and permissions, but if the checkout uses the PR head SHA, the working
      directory contains fork-controlled code. Any build, install, or
      script execution runs attacker code with full secret access.
    platforms: [github]
    trigger: [pull_request_target]
    trust_boundary: fork_controlled_code -> base_repo_secrets
    attacker_model: fork_pr
    impact: [rce, secret_exfil]
    severity_base: critical
    requires_self_hosted: false
    severity_notes: |
      CRITICAL when present. Classic pwn request. Full RCE with all repo
      secrets. Only mitigations: don't checkout PR head at all, or
      checkout in separate job with no secrets passing only validated data.
    detection:
      type: structural
      grep_patterns:
        - 'pull_request_target'
      then_check:
        - 'actions/checkout'
        - '${{ github.event.pull_request.head.sha }}'
        - '${{ github.event.pull_request.head.ref }}'
        - 'ref: ${{ github.head_ref }}'
      safe_if:
        - "ref: ${{ github.sha }} (checks out base, not PR head)"
        - "No checkout step"
        - "Checkout in job with permissions: {} and no secrets"
    mitigations:
      - Never check out PR head in a pull_request_target workflow
      - If required, use separate unprivileged job, pass only safe outputs
      - Scope to author_association (MEMBER, COLLABORATOR)
    cwe: CWE-829
    tags: [trigger, pwn-request, pull-request-target, checkout]
    references:
      - https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
    status: documented

  - id: issue-comment-fork-checkout
    title: issue_comment trigger with fork code checkout and elevated permissions
    description: |
      A workflow triggered by issue_comment checks out PR/fork code and
      has elevated permissions. Any GitHub user can post a comment on any
      public repo's PR. If the workflow gates only on comment text, an
      attacker can trigger privileged operations on fork-controlled code.
      GITHUB_REF for issue_comment is always the default branch, so
      provenance attestations look legitimate even when running fork code.
    platforms: [github]
    trigger: [issue_comment]
    trust_boundary: unauthenticated_comment -> fork_code_execution -> privileged_operations
    attacker_model: fork_pr
    impact: [rce, secret_exfil, supply_chain]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      High because the comment trigger is unauthenticated — any GitHub
      user can post on any public PR. Combined with fork checkout and
      elevated permissions, this gives full RCE with secrets. The
      GITHUB_REF default-branch aliasing makes provenance look clean.
    detection:
      type: structural
    mitigations:
      - Do not check out PR head code in issue_comment workflows
      - Verify commenter authorization via github.event.comment.author_association
      - Use separate unprivileged job for checkout, pass only safe outputs
      - Require MEMBER or OWNER association, not just CONTRIBUTOR
    cwe: CWE-829
    tags: [trigger, issue-comment, checkout, chatops, provenance]
    references:
      - https://socket.dev/blog/openapi-react-query-codegen-npm-compromise
      - https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
    status: active
