patterns:

  - id: buildkite-env-injection
    title: Tainted environment variable in command step
    description: |
      A Buildkite command step interpolates an attacker-controlled
      environment variable ($BUILDKITE_BRANCH, $BUILDKITE_MESSAGE)
      directly into a shell command. Fork PR authors control branch
      names and commit messages; shell metacharacters in the value
      produce command injection.
    platforms: [buildkite]
    trigger: [push]
    trust_boundary: untrusted_user_input -> shell_execution
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      Buildkite pipelines run on self-hosted agents by default.
      $BUILDKITE_MESSAGE is particularly dangerous because commit
      messages are always attacker-controlled. Fork PR builds can be
      configured to run automatically or require approval.
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - '$BUILDKITE_BRANCH'
        - '${BUILDKITE_BRANCH}'
        - '$BUILDKITE_MESSAGE'
        - '${BUILDKITE_MESSAGE}'
        - '$BUILDKITE_COMMIT_MESSAGE'
        - '${BUILDKITE_COMMIT_MESSAGE}'
        - '$BUILDKITE_PULL_REQUEST_TITLE'
        - '${BUILDKITE_PULL_REQUEST_TITLE}'
        - '$BUILDKITE_PULL_REQUEST_DESCRIPTION'
        - '${BUILDKITE_PULL_REQUEST_DESCRIPTION}'
        - '$BUILDKITE_BUILD_CREATOR'
        - '${BUILDKITE_BUILD_CREATOR}'
        - '$BUILDKITE_TAG'
        - '${BUILDKITE_TAG}'
    mitigations:
      - Quote variables in shell commands
      - Use environment hooks to sanitize input
      - Restrict fork PR builds to require approval
    cwe: CWE-78
    tags: [injection, buildkite, environment-variable]
    status: active

  - id: buildkite-pipeline-upload
    title: Dynamic pipeline upload from untrusted source
    description: |
      A Buildkite step runs `buildkite-agent pipeline upload` which
      reads a YAML file from the checked-out repository and executes
      it as pipeline configuration. In fork PR builds, the YAML is
      controlled by the fork author. A malicious pipeline.yml can
      define steps that exfiltrate secrets, install persistence, or
      run arbitrary code on the agent.
    platforms: [buildkite]
    trigger: [push]
    trust_boundary: fork_controlled_code -> pipeline_definition
    attacker_model: fork_pr
    impact: [rce, secret_exfil]
    severity_base: critical
    requires_self_hosted: false
    severity_notes: |
      This is Buildkite's equivalent of GitHub's pull_request_target
      vulnerability. The uploaded pipeline runs with full agent access
      and all configured environment hooks. Secrets available to the
      agent are exposed.
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - 'pipeline upload'
    mitigations:
      - Use pipeline.yml from a trusted branch, not the PR head
      - Require pipeline upload approval for fork PRs
      - Use a restricted agent pool for untrusted builds
      - Define the pipeline in Buildkite UI instead of the repo
    cwe: CWE-829
    tags: [injection, buildkite, dynamic-pipeline, supply-chain]
    status: active
