patterns:

  - id: expr-injection-run
    title: Expression injection in run block
    description: |
      Untrusted data from event context (PR title, branch name, commit
      message, issue body) is interpolated via ${{ }} into a run: block.
      The expression expands before the shell executes, so metacharacters
      in the value produce command injection.
    platforms: [github]
    trigger: [pull_request, pull_request_target, issues, issue_comment, workflow_run]
    trust_boundary: untrusted_user_input -> shell_execution
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      On ephemeral runners with fork PR trigger: RCE with read-only
      GITHUB_TOKEN, no repo secrets. Low real impact unless combined
      with other findings or non-default permissions.
      On self-hosted runners: persistent RCE with cached credentials.
      With pull_request_target or workflow_run: secrets in scope.
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - '${{ github.event.pull_request.title }}'
        - '${{ github.event.pull_request.body }}'
        - '${{ github.event.pull_request.head.ref }}'
        - '${{ github.event.issue.title }}'
        - '${{ github.event.issue.body }}'
        - '${{ github.event.comment.body }}'
        - '${{ github.event.head_commit.message }}'
        - '${{ github.event.workflow_run.display_title }}'
        - '${{ github.head_ref }}'
      safe_contexts:
        - '${{ github.event.pull_request.number }}'
        - '${{ github.sha }}'
        - '${{ github.event.pull_request.head.sha }}'
        - '${{ github.event.workflow_run.head_sha }}'
        - '${{ github.event.issue.number }}'
      exclude_if_in:
        - 'env:'
        - 'with:'
    mitigations:
      - Route untrusted data through env vars and quote on use
      - Use actions/github-script instead of shell for GitHub API operations
      - Validate/sanitize input before interpolation
    cwe: CWE-78
    tags: [injection, shell, pr-input]
    references:
      - https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
      - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
    status: documented

  - id: expr-injection-github-script
    title: Expression injection in actions/github-script
    description: |
      Untrusted data interpolated via ${{ }} into the script: input of
      actions/github-script. Quote breakout gives arbitrary JS execution
      with the authenticated octokit client and GITHUB_TOKEN.
    platforms: [github]
    trigger: [pull_request, pull_request_target, workflow_run]
    trust_boundary: untrusted_user_input -> javascript_execution
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      Same as expr-injection-run but in Node.js with octokit. If the job
      has pull-requests: write or issues: write, the attacker can act as
      github-actions[bot]. The JS context provides fetch() for OOB.
    detection:
      type: single_step
      in_block: script
      grep_patterns:
        - "actions/github-script"
      dangerous_patterns:
        - "const x = '${{ ... }}'"
        - 'const x = "${{ ... }}"'
        - "`${{ ... }}`"
      look_for: "${{ }} inside string literals in the script body"
    mitigations:
      - Pass untrusted values via env vars, access as process.env.X in script
      - Use core.getInput() for action inputs
    actions_versions:
      - action: actions/github-script
        notes: "All versions — the injection is in caller's script: input, not the action"
    cwe: CWE-94
    tags: [injection, javascript, github-script]
    references:
      - https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
    status: documented

  - id: fs-to-matrix-injection
    title: Filesystem content to matrix to shell injection
    description: |
      A workflow reads directory/file names from the checked-out repo
      (readdirSync, ls, find, glob) and passes them into a matrix. Matrix
      values interpolated via ${{ }} into run: blocks. Fork-controlled
      names with shell metacharacters execute as commands.
    platforms: [github]
    trigger: [pull_request]
    trust_boundary: fork_controlled_filesystem -> shell_execution_via_matrix
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      Same impact as expr-injection-run but harder to spot: the injection
      source is filesystem content, the matrix intermediary obscures the
      data flow. The payload persists in git (directory name) rather than
      ephemeral event data.
    detection:
      type: cross_step
      grep_patterns:
        - 'readdirSync'
        - 'matrix.'
        - '${{ matrix.'
      check_chain: |
        1. Script reads directory/file names from checked-out repo
        2. Names written to GITHUB_OUTPUT as JSON array
        3. Matrix strategy uses fromJson() on that output
        4. Matrix values interpolated into run: blocks
      safe_if:
        - "Directory names validated against strict pattern (e.g. /^[a-z0-9-]+$/)"
        - "Matrix values passed through env vars, not ${{ }} interpolation"
    mitigations:
      - Validate directory/file names against a strict allowlist pattern
      - Pass matrix values through env vars
      - Quote matrix values in shell commands (partial mitigation)
    cwe: CWE-78
    tags: [injection, shell, matrix, filesystem, chain]
    status: documented

  - id: fork-script-output-injection
    title: Fork script output to GITHUB_OUTPUT interpolation
    description: |
      A pull_request workflow checks out the fork's code and runs a script.
      The script's stdout is captured into GITHUB_OUTPUT. A subsequent step
      interpolates that output via ${{ }} into a run: or github-script.
      The fork author controls the script, its output, and the interpolation.
    platforms: [github]
    trigger: [pull_request]
    trust_boundary: fork_controlled_script -> workflow_output -> shell_or_js_execution
    attacker_model: fork_pr
    impact: [rce]
    severity_base: high
    requires_self_hosted: false
    severity_notes: |
      Multi-step injection where each step looks safe individually. Often
      missed in review because the script is "just writing output" and
      the interpolation is "just reading an output."
    detection:
      type: cross_step
      check_chain: |
        1. actions/checkout checks out fork code (default for pull_request)
        2. run: step executes script from checked-out code
        3. Script output written to GITHUB_OUTPUT
        4. Later step uses ${{ steps.X.outputs.Y }} in run: or script:
    mitigations:
      - Don't run fork scripts if their output will be interpolated
      - Validate/sanitize script output before writing to GITHUB_OUTPUT
      - Use env vars instead of ${{ }} for consuming outputs in shell
    cwe: CWE-78
    tags: [injection, chain, fork-script, output]
    status: documented

  - id: dispatch-input-injection
    title: workflow_dispatch input interpolation in shell
    description: |
      A workflow_dispatch workflow interpolates user-provided input values
      via ${{ inputs.X }} into run: blocks. While dispatch requires write
      access, input values are free-form strings with shell metacharacters.
    platforms: [github]
    trigger: [workflow_dispatch]
    trust_boundary: authenticated_user_input -> shell_execution
    attacker_model: contributor
    impact: [rce, secret_exfil]
    severity_base: medium
    requires_self_hosted: false
    severity_notes: |
      Requires write access to trigger. Usually "requires-admin-already"
      for bounties. Relevant as privilege escalation if the workflow has
      secrets the contributor doesn't normally access (deploy tokens,
      signing keys).
    detection:
      type: single_step
      in_block: run
      grep_patterns:
        - 'workflow_dispatch'
        - '${{ github.event.inputs.'
        - '${{ inputs.'
      safe_if:
        - "Inputs are choice type with fixed options"
        - "Inputs are routed through env vars and quoted"
        - "Inputs are boolean or number type"
    mitigations:
      - Use choice type inputs with fixed options
      - Route inputs through env vars and quote in shell
      - Validate input format before use
    cwe: CWE-78
    tags: [injection, shell, dispatch, contributor]
    status: documented
